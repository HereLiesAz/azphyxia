name: Build and Release APK

# Every push to main builds a signed release APK and publishes it as a GitHub
# Release (continuous delivery — no tag needs to be pushed manually). Can also
# be run by hand from the Actions tab against any branch/commit.
#
# AppUpdateManager (app/src/main/java/com/lumera/app/data/update/) polls this
# repo's *latest* (non-prerelease) release, so this workflow's release shape
# must keep matching what it expects: exactly one *.apk asset, and a
# `SHA-256: <64 hex chars>` line in the release body for checksum verification.
#
# Versioning: since there's no tag to read a version from, versionName is
# MAJOR.MINOR (read from app/build.gradle.kts) with the GitHub Actions run
# number as the patch component, e.g. 0.1.47 — guaranteed to strictly
# increase every run, which both Android's package installer (versionCode)
# and AppUpdateManager's version comparison require to recognize an upgrade.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "ci/README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumera
        uses: actions/checkout@v4
        with:
          path: Lumera
          fetch-depth: 0

      # settings.gradle.kts expects the assrender module as a sibling directory:
      # project(":assrender").projectDir = file("../assrender/assrender")
      - name: Checkout assrender (sibling module dependency)
        uses: actions/checkout@v4
        with:
          repository: LumeraD3v/assrender
          path: assrender

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: Lumera
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        working-directory: Lumera
        run: |
          set -euo pipefail
          BASE=$(grep -oP 'versionName = \(project\.findProperty\("versionNameOverride"\) as String\?\) \?: "\K[^"]+' app/build.gradle.kts)
          MAJOR_MINOR=$(echo "$BASE" | grep -oP '^\d+\.\d+')
          NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          TAG="v${NAME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_STORE_BASE64 != '' }}
        working-directory: Lumera
        run: echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        working-directory: Lumera
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_BASE64 != '' && 'release.keystore' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionNameOverride="${{ steps.version.outputs.name }}" \
            -PversionCodeOverride="${{ steps.version.outputs.code }}"

      - name: Locate and rename APK
        id: apk
        working-directory: Lumera
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK produced under app/build/outputs/apk/release" >&2
            exit 1
          fi
          DEST="Lumera-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=Lumera/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256
        id: checksum
        run: |
          HASH=$(sha256sum "${{ steps.apk.outputs.path }}" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since previous release
        id: changelog
        working-directory: Lumera
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "log<<EOF"
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty="format:- %s" --no-merges
            else
              echo "- Initial release"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lumera ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.log }}

            ---
            SHA-256: ${{ steps.checksum.outputs.hash }}
