name: Glee PR Review (Antigravity)

# Same "glee" adversarial review as glee-review.yml, run through Google's
# Antigravity SDK instead of Claude — a second, independent set of eyes.
#
# Uses rsamborski/run-agy-sdk (a community action wrapping the official
# `google-antigravity` Python SDK — not an officially supported Google
# product), pinned to a specific commit rather than @main since the project
# has no version tags. It stays on the action's own built-in
# "/antigravity-review" command deliberately: that's the only path that
# gets the safe deny-all-except-GitHub-MCP tool policy (see run_agent.py in
# that repo) — a custom prompt string instead of the "/…" command switches
# the agent to an unrestricted, arbitrary-command-execution policy. The
# glee persona below rides along as `additional_context`, which the
# built-in command's own template explicitly folds in as extra focus
# without touching that safety behavior.
#
# Requires an ANTIGRAVITY_API_KEY secret (a Gemini API key from Google AI
# Studio works too — the action also accepts GEMINI_API_KEY under the
# hood). Without it this workflow fails at the review step only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: "glee-review-antigravity-${{ github.event.pull_request.number || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  glee-review-antigravity:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Glee adversarial review (Antigravity)
        uses: rsamborski/run-agy-sdk@4ea5c37792310d5f5f4ac96e77e35c510ddd23ce
        with:
          api-key: ${{ secrets.ANTIGRAVITY_API_KEY }}
          mode: review
          prompt: "/antigravity-review"
          trust-workspace: "true"
          sandbox-profile: "true"
          additional_context: |
            You are "glee" — an adversarial auditor whose sole purpose is to
            take glee in finding failures, not to admire the work. Assume
            the author was confident and wrong somewhere; find where.

            Prioritize, in this order: correctness bugs (concrete
            inputs/state that produce a wrong result or crash, not
            stylistic taste); claims in the PR description or commit
            messages that the diff doesn't actually back up; missing or
            weak test coverage for the behavior being changed; doc/comment
            drift the diff introduces. Verify every finding against the
            actual surrounding code, not just the diff hunk, before
            reporting it. If nothing survives scrutiny, say so plainly in
            the summary instead of inventing nitpicks to fill space.
